<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins","Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    overflow:hidden;
}

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
}

body::before{
    width:300px;
    height:300px;
    background:#38bdf8;
    top:-80px;
    left:-80px;
}

body::after{
    width:350px;
    height:350px;
    background:#7c3aed;
    bottom:-120px;
    right:-120px;
}

.container{
    width:420px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:25px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.container h1{
    color:white;
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    color:#dbeafe;
    text-align:center;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.9);
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    box-shadow:0 0 0 3px rgba(59,130,246,.4);
}

.signup-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    color:white;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    transition:.3s;
    margin-top:10px;
}

.signup-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.4);
}

.login{
    margin-top:25px;
    text-align:center;
    color:#dbeafe;
}

.login a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.login a:hover{
    text-decoration:underline;
}

</style>

</head>
<body>

<div class="container">

    <h1>Create Account</h1>

    <p class="subtitle">Join our online banking system</p>

    <form action="/EwalletSystem/AccountController" method="post">

        <input type="hidden" name="action" value="signup">

        <div class="input-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                type="tel"
                name="phoneNumber"
                placeholder="01001234567"
                required>
        </div>

        <div class="input-group">
            <label>Age</label>
            <input
                type="number"
                name="age"
                min="18"
                max="120"
                placeholder="Enter age"
                required>
        </div>

        <button class="signup-btn" type="submit">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="Login.jsp">Login</a>
    </div>

</div>

</body>
</html>
