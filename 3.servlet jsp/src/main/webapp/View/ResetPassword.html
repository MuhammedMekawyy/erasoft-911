<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#141E30,#243B55);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.container{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h2{
    text-align:center;
    color:#243B55;
    font-size:34px;
    margin-bottom:30px;
    letter-spacing:1px;
}

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#243B55;
    font-weight:600;
    font-size:15px;
}

input{
    width:100%;
    padding:14px 16px;
    border:2px solid #dcdcdc;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
    outline:none;
}

input:focus{
    border-color:#00B4D8;
    box-shadow:0 0 10px rgba(0,180,216,.25);
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#06D6A0,#1B9AAA);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(6,214,160,.45);
}

.btn:active{
    transform:scale(.97);
}

.back-link{
    margin-top:20px;
    text-align:center;
}

.back-link a{
    color:#1B9AAA;
    font-weight:bold;
    text-decoration:none;
}

.back-link a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="container">

    <h2>Reset Password</h2>

    <form action="/ItemsProject/UserController" method="post">

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input
                type="password"
                name="newPassword"
                placeholder="Enter new password"
                required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input
                type="password"
                name="confirmPassword"
                placeholder="Confirm new password"
                required>
        </div>

        <input type="hidden" name="action" value="resetPassword">

        <button type="submit" class="btn">
            Reset Password
        </button>

    </form>

    <div class="back-link">
        <a href="Login.jsp">Back to Login</a>
    </div>

</div>

</body>
</html>
